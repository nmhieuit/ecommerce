# Static hosting for the storefront's production build.
#
# The one rule that matters here is the history fallback. The storefront routes on the client, and
# two of its three screens live at real paths (/basket, /confirmation). Without `try_files`, a
# reload on /basket asks the server for a file that does not exist and gets a 404 — which would
# break spec 004's FR-011 (the basket survives a refresh), its quickstart Scenario 3, and the
# end-to-end walkthrough, which calls page.reload() on exactly that path.

server {
    listen       80;

    # IPv6 as well, and this is load-bearing rather than thorough. The nginx image adds this line
    # itself to the config it ships, but skips a config that has been replaced — as this one has.
    # Without it nginx binds IPv4 only, and anything resolving `localhost` to ::1 first (busybox
    # wget, which is what the container's health check uses) gets connection refused from a server
    # that is running perfectly. It looks like a dead container and is not one.
    listen       [::]:80;

    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Serve the file if it exists, the directory if that exists, and otherwise hand back the app
    # and let the client router decide. This is what makes a deep link and a refresh work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable by construction — Vite puts the content hash in the filename, so a
    # changed file is a different URL and can never be served stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached: it is the document that names the current asset hashes, so a
    # cached copy pins a browser to a previous deployment's assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
