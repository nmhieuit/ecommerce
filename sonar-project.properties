# SonarQube analysis configuration for the whole monorepo (spec 012-sonarqube-quality-gate).
#
# One Sonar project covers backend (services/) and frontend (frontend/) so a pull request gets a
# single quality-gate result rather than one per service (research.md Decision 4).
#
# This file is the single source of truth for scanner settings. Because the analysis is driven by
# SonarScanner for .NET — which takes settings as `/d:` command-line arguments and does not read a
# sonar-project.properties file of its own — scripts/ci/sonar-begin.sh translates the keys below
# into those arguments. Add settings here, never directly in the Jenkinsfile.

sonar.projectKey=ecommerce
sonar.projectName=Ecommerce Platform

# Analysis scope. SonarScanner for .NET derives the C# file set from the MSBuild project graph and
# picks up other languages from the project base directory, so sonar-begin.sh does not forward
# sonar.sources/sonar.tests to the scanner (it rejects settings it computes itself). They are
# recorded here as the declared scope of analysis, and the exclusions below are what actually
# narrow it.
sonar.sources=services,frontend
sonar.tests=services,tests,frontend/apps/web/tests

sonar.sourceEncoding=UTF-8

# Build output, dependencies, and generated code: not authored here, so not the gate's business.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.turbo/**,**/TestResults/**,**/artifacts/**,**/src/generated/**,**/*.min.js,**/coverage/**,**/playwright-report/**,**/test-results/**

# Test code is analyzed for issues but excluded from the coverage denominator.
sonar.coverage.exclusions=**/tests/**,**/*.Tests/**,**/*Tests/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Coverage inputs to the quality gate (research.md Decision 4).
#
# Backend: every `dotnet test --collect:"XPlat Code Coverage"` run writes a Cobertura report under
# its project's TestResults/; scripts/ci/merge-coverage.sh collapses them into the one file below,
# re-running after each test tier so unit, integration, and contract coverage are all included by
# the time the analysis is uploaded.
sonar.cs.cobertura.reportsPaths=artifacts/coverage/backend.cobertura.xml

# Frontend: Vitest's v8 provider writes lcov per workspace package (see
# frontend/apps/web/vitest.config.ts).
sonar.javascript.lcov.reportPaths=frontend/apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/apps/web/coverage/lcov.info
