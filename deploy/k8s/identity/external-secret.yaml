# specs/018-cluster-secret-store/contracts/external-secret-manifest-contract.md
#
# Declarative only — applied to a real cluster once the Vault + External Secrets Operator
# infrastructure from docs/adr/0007-secrets-delivery.md is provisioned (see ../README.md). Until
# then this is a reviewable contract, not a live resource.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-secrets
  namespace: ecommerce
spec:
  # <=5m per SC-004 (rotate in Vault, no redeploy) — specs/018-cluster-secret-store/research.md #2.
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: identity-secrets
    creationPolicy: Owner
  data:
    # secretKey uses the environment-variable form of RequiredSecret.Name
    # (services/identity/src/Identity.Api/Program.cs:
    # RequiredSecret.ConnectionString("IdentityDb") -> "ConnectionStrings:IdentityDb" ->
    # "ConnectionStrings__IdentityDb"). remoteRef.key/property are placeholders — the real Vault
    # path is filled in by the platform team when Vault is provisioned.
    #
    # No JWT signing-key entry here yet: Program.cs does not currently configure an explicit
    # signing credential (Duende IdentityServer falls back to its own developer signing credential
    # — a pre-existing gap tracked separately, out of scope for specs/018-cluster-secret-store,
    # which addresses what the code actually reads today).
    - secretKey: ConnectionStrings__IdentityDb
      remoteRef:
        key: secret/identity
        property: connectionstring
