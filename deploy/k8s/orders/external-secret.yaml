# specs/018-cluster-secret-store/contracts/external-secret-manifest-contract.md
#
# Declarative only — applied to a real cluster once the Vault + External Secrets Operator
# infrastructure from docs/adr/0007-secrets-delivery.md is provisioned (see ../README.md). Until
# then this is a reviewable contract, not a live resource.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-secrets
  namespace: ecommerce
spec:
  # <=5m per SC-004 (rotate in Vault, no redeploy) — specs/018-cluster-secret-store/research.md #2.
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: orders-secrets
    creationPolicy: Owner
  data:
    # secretKey uses the environment-variable form of RequiredSecret.Name
    # (services/orders/src/Orders.Api/Program.cs: RequiredSecret.ConnectionString("OrdersDb") ->
    # "ConnectionStrings:OrdersDb" -> "ConnectionStrings__OrdersDb"). remoteRef.key/property are
    # placeholders — the real Vault path is filled in by the platform team when Vault is
    # provisioned, matching the quickstart.md Kịch bản 3 `vault kv put secret/orders
    # connectionstring=...` example.
    - secretKey: ConnectionStrings__OrdersDb
      remoteRef:
        key: secret/orders
        property: connectionstring
