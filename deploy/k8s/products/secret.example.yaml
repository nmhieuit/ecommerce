# EXAMPLE ONLY — never apply this file to any cluster. It documents the shape of the K8s `Secret`
# object External Secrets Operator creates from external-secret.yaml in this directory, so a
# reviewer can confirm the key name without Vault access. See
# specs/018-cluster-secret-store/contracts/external-secret-manifest-contract.md.
#
# REPLACE_ME below is a deliberately inert placeholder — never a real value (and, being a
# placeholder rather than a credential-shaped string, does not trip
