# Service manifest — baskets
#
# Constitution Principle VIII: "Every service MUST declare its SLOs — latency, error rate, and
# availability — in its service manifest, and those SLOs MUST be measured continuously from the
# telemetry required by Principle VII." Declared at scaffold time so the budget is measured from
# day one rather than bolted on after the first regression.
#
# Scope note: beyond the health probes, this service exposes the minimal basket read endpoint
# added by 002-gateway-bff-routing. Further domain endpoints declare their own budgets here as
# they are added.

service:
  name: baskets
  description: >-
    Owns shopping-basket records. Exposes the minimal basket read surface the BFF's basket route
    proxies (002-gateway-bff-routing); line items and basket behaviour arrive with this service's
    first domain story.
  classification: internal-service-api
  stateless: true

data:
  store: sql-server
  database: baskets
  connection-string-key: ConnectionStrings:BasketsDb
  # FR-004 / FR-005 — owned exclusively; enforced by tests/CrossServiceIsolation.Tests.
  owned-exclusively: true
  # The constitution also earmarks Redis as the basket store; not wired in this scaffold, and it
  # will be declared here alongside SQL Server when it lands.

slos:
  # Platform defaults for an internal service API (constitution Principle VIII). No justified
  # alternative is claimed, so the defaults apply verbatim.
  availability: 99.9%          # monthly
  error-rate:
    max-5xx-ratio: 0.1%
  latency:
    p95: 150ms
    p99: 500ms

endpoints:
  - route: GET /baskets/{basketId}
    purpose: >-
      Returns a single basket. The downstream surface the BFF's basket route proxies
      (contracts/downstream-openapi.yaml). Unknown id returns 404, never an empty 200.
    authentication: bearer   # 014-identity-server-auth: AddIdentityValidation(), independent of the gateway (spec FR-004)
    authorization: ecommerce-api-scope   # 015-deny-by-default-authz: .RequireAuthorization(AuthorizationPolicies.ApiScope)
    latency:
      p95: 150ms
      p99: 500ms
  - route: GET /health/live
    purpose: Liveness probe. Kubernetes restarts the pod on repeated failure.
    authentication: anonymous   # probes cannot present a token — see plan.md Constitution Check
    authorization: anonymous
    latency:
      p95: 150ms
      p99: 500ms
  - route: GET /health/ready
    purpose: Readiness probe. Gates traffic on this service's own database being reachable.
    authentication: anonymous
    authorization: anonymous
    latency:
      p95: 150ms
      p99: 500ms

observability:
  # Principle VII — emitted via shared/ServiceDefaults, never configured per service by hand.
  traces: otlp
  metrics: otlp
  logs: otlp
  correlation-id-header: X-Correlation-Id
