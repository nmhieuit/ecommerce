# Service manifest — identity
#
# Constitution Principle VIII: "Every service MUST declare its SLOs — latency, error rate, and
# availability — in its service manifest, and those SLOs MUST be measured continuously from the
# telemetry required by Principle VII." Declared at scaffold time so the budget is measured from
# day one rather than bolted on after the first regression.

service:
  name: identity
  classification: internal-service-api
  description: >-
    Central identity server (ADR-0001: Duende IdentityServer). Authenticates users and issues
    tokens carrying verified identity and tenant claims, replacing the Phase 1 hardcoded stub
    identity (014-identity-server-auth). Owns its own credential/configuration store, separate from
    the `parties` service's business data (research.md Decision 8).

data:
  store: sql-server
  database: identity
  connection-string-key: ConnectionStrings:IdentityDb
  # Three DbContexts, one database: the user credential store (ASP.NET Core Identity) and Duende's
  # configuration/operational stores, each with its own migrations history table
  # (Data/MigrationsHistoryTables.cs) — data-model.md Identity User, Client Application.
  owned-exclusively: true

slos:
  # Platform defaults for an internal service API (constitution Principle VIII). No justified
  # alternative is claimed, so the defaults apply verbatim.
  availability: 99%            # weekly
  error-rate:
    max-5xx-ratio: 1%
  latency:
    p95: 500ms
    p99: 700ms

error-budget-policy:
  # SCRUM-35 / constitution Principle VIII (2.0.0): "Sustained SLO breach consumes the error budget:
  # when a service's error budget is exhausted, reliability work takes priority over new feature work
  # in that service until it recovers." This block gives that sentence its numbers
  # (specs/029-error-budget-weekly/contracts/error-budget-policy-manifest-shape.md). The budget window
  # is the calendar week in Vietnam time — Monday 00:00 to Sunday 23:59, UTC+7 — and resets every
  # Monday 00:00. Measured and alerted on by the Kibana rules tagged slo-error-budget
  # (docs/kibana-quan-sat-he-thong/07-canh-bao-ngan-sach-loi.md).
  window: calendar-week
  timezone: UTC+07:00
  # Spec 033: span health check (đường dẫn bắt đầu bằng /health) không tính vào ngân sách; rule và panel dùng đúng tiền tố này.
  excluded-path-prefixes: [/health]
  budgets:
    availability:
      bad-request: http-5xx
      allowed-bad-ratio: 1%
    error-rate:
      bad-request: http-5xx
      allowed-bad-ratio: 1%
    latency-p95:
      bad-request: slower-than-slo-p95   # threshold is slos.latency.p95 above — never restated here
      allowed-bad-ratio: 5%
    latency-p99:
      bad-request: slower-than-slo-p99   # threshold is slos.latency.p99 above — never restated here
      allowed-bad-ratio: 1%
  alert-thresholds: [50%, 75%, 100%]
  exhausted-when: any-budget-at-100%
  on-exhausted:
    who: Người vận hành (vai SRE/Dev) của service này
    stops: Merge tính năng mới vào service này
    does: Chỉ làm công việc nâng độ tin cậy cho service này
  recovery:
    consecutive-days-meeting-slo: 3
    no-traffic-day-counts-as-met: true
    budget-reset-clears-freeze: false

endpoints:
  - route: POST /connect/token
    purpose: >-
      Issues an access token carrying verified identity (sub) and tenant (tenant_id) claims
      (contracts/identity-token-claims-contract.md; spec Test Scenario 1). Duende-hosted; no
      handler of this service's own.
    authentication: anonymous   # the credentials in the request body ARE the authentication
    latency:
      p95: 500ms
      p99: 700ms
  - route: GET /.well-known/openid-configuration
    purpose: >-
      OIDC discovery document every consumer's AddIdentityValidation()/toggle-gated JwtBearer
      registration fetches once and caches (research.md Decision 5) — never on the request path.
    authentication: anonymous
    latency:
      p95: 500ms
      p99: 700ms
  - route: GET /health/live
    purpose: Liveness probe. Kubernetes restarts the pod on repeated failure.
    authentication: anonymous   # probes cannot present a token
    latency:
      p95: 500ms
      p99: 700ms
  - route: GET /health/ready
    purpose: >-
      Readiness probe, gated on this service's own "identity" database being reachable (a raw SQL
      connection check, matching every other database-owning service's pattern).
    authentication: anonymous
    latency:
      p95: 500ms
      p99: 700ms

observability:
  # Principle VII — emitted via shared/ServiceDefaults, never configured per service by hand.
  traces: otlp
  metrics: otlp
  logs: otlp
  correlation-id-header: X-Correlation-Id
