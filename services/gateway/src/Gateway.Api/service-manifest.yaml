# Service manifest — gateway
#
# Constitution Principle VIII: "Every service MUST declare its SLOs — latency, error rate, and
# availability — in its service manifest, and those SLOs MUST be measured continuously from the
# telemetry required by Principle VII." Declared at scaffold time so the budget is measured from
# day one rather than bolted on after the first regression.
#
# Scope note: the health endpoints are the only surface this service exposes today. The forwarding
# route declares its own budget here when T030/T031 add it.

service:
  name: gateway
  description: >-
    API gateway. Forwards all client API traffic to the BFF so no caller needs to know service
    topology (ADR-0002). Routing shell only — no forwarding route configured yet.
  classification: internal-service-api
  stateless: true

data:
  # No data section equivalent to the domain services': the gateway owns no database and reads no
  # other service's (constitution Principle I — only services owning business invariants get
  # persistence). There is deliberately no connection-string key for it to be given.
  store: none
  owned-exclusively: false

slos:
  # Deliberately NOT the internal-service-api default (p95 500ms / p99 700ms): every gateway request
  # is forwarded to the BFF, so its latency is the BFF's client-facing budget (p95 700ms / p99
  # 1000ms) plus the gateway's own forwarding overhead. A gateway budget at or below the BFF's could
  # never be met by a healthy system, hence the 100ms of headroom on top of the BFF's figures.
  availability: 99%            # weekly
  error-rate:
    max-5xx-ratio: 1%
  latency:
    p95: 800ms
    p99: 1100ms
  justification: >-
    The gateway forwards every request to the BFF, so its latency includes the BFF's own budget
    (p95 700ms / p99 1000ms) plus about 100ms of forwarding overhead. Holding it to the
    internal-service-api default (p95 500ms / p99 700ms) would be tighter than the service it
    fronts, which no healthy system can satisfy.

error-budget-policy:
  # SCRUM-35 / constitution Principle VIII (2.0.0): "Sustained SLO breach consumes the error budget:
  # when a service's error budget is exhausted, reliability work takes priority over new feature work
  # in that service until it recovers." This block gives that sentence its numbers
  # (specs/029-error-budget-weekly/contracts/error-budget-policy-manifest-shape.md). The budget window
  # is the calendar week in Vietnam time — Monday 00:00 to Sunday 23:59, UTC+7 — and resets every
  # Monday 00:00. Measured and alerted on by the Kibana rules tagged slo-error-budget
  # (docs/kibana-quan-sat-he-thong/07-canh-bao-ngan-sach-loi.md).
  window: calendar-week
  timezone: UTC+07:00
  # Spec 033: span health check (đường dẫn bắt đầu bằng /health) không tính vào ngân sách; rule và panel dùng đúng tiền tố này.
  excluded-path-prefixes: [/health]
  budgets:
    availability:
      bad-request: http-5xx
      allowed-bad-ratio: 1%
    error-rate:
      bad-request: http-5xx
      allowed-bad-ratio: 1%
    latency-p95:
      bad-request: slower-than-slo-p95   # threshold is slos.latency.p95 above — never restated here
      allowed-bad-ratio: 5%
    latency-p99:
      bad-request: slower-than-slo-p99   # threshold is slos.latency.p99 above — never restated here
      allowed-bad-ratio: 1%
  alert-thresholds: [50%, 75%, 100%]
  exhausted-when: any-budget-at-100%
  on-exhausted:
    who: Người vận hành (vai SRE/Dev) của service này
    stops: Merge tính năng mới vào service này
    does: Chỉ làm công việc nâng độ tin cậy cho service này
  # Nhánh fix/frozen-panel-status (thay quy tắc "3 ngày liên tiếp đạt SLO" của spec 027 FR-010 / 029 FR-005).
  # Sau một lần cạn (sự kiện "exhausted" của rule error-budget-100), service ở một trong ba trạng thái, xét
  # theo mức tiêu hao CAO NHẤT trong 4 ngân sách của tuần lịch hiện tại:
  #   active     — mức tiêu hao >= 100%: đóng băng.
  #   recovering — dưới 100% nhưng >= 75%, hoặc tuần chưa có request Server nào (thứ Hai 00:00 không tự gỡ): vẫn đóng băng.
  #   recovered  — tuần đã có >= 1 request và mức tiêu hao < 75%: hết đóng băng; giữ recovered dù mức tiêu hao lên
  #                lại 75–99%, chỉ đóng băng lại khi chạm 100% (sự kiện "exhausted" mới).
  # Rule error-budget-frozen và panel "Cạn ngân sách" dùng đúng các con số này
  # (docs/kibana-quan-sat-he-thong/07-canh-bao-ngan-sach-loi.md).
  recovery:
    recovered-below-consumption: 75%
    min-requests-to-recover: 1
    recovering-keeps-freeze: true
    recovered-stays-until-exhausted: true
    budget-reset-clears-freeze: false

endpoints:
  - route: ANY /{**catch-all}
    purpose: >-
      Forwards every request that is not one of this service's own health probes to the BFF
      (research.md Decision 1/2; spec FR-001). A catch-all is deliberate: enumerating the BFF's
      paths here would reintroduce the topology coupling the gateway exists to remove.
      Unmatched application paths are answered 404 by the BFF, which holds the finite route table.
    authentication: anonymous   # no identity server yet — see plan.md Constitution Check (VI)
    forwards-to: bff
    forwarding-timeout: 10s     # must stay >= the BFF's 3s per-downstream budget (data-model.md);
                                # enforced by Gateway.Api.UnitTests/ForwardingTimeoutBudgetTests
    latency:
      # Includes the BFF's time (the gateway forwards every request to it): the BFF's client-facing
      # SLO (p95 700ms / p99 1000ms) plus the gateway's own forwarding overhead.
      p95: 800ms
      p99: 1100ms
  - route: GET /health/live
    purpose: Liveness probe. Kubernetes restarts the pod on repeated failure.
    authentication: anonymous   # probes cannot present a token — see plan.md Constitution Check
    latency:
      p95: 500ms
      p99: 700ms
  - route: GET /health/ready
    purpose: >-
      Readiness probe. Gates traffic on this process accepting requests only — deliberately not on
      the BFF being reachable, so a BFF outage produces a clear bounded error per request (FR-006)
      rather than pulling every gateway instance out of rotation.
    authentication: anonymous
    latency:
      p95: 500ms
      p99: 700ms

observability:
  # Principle VII — emitted via shared/ServiceDefaults, never configured per service by hand.
  traces: otlp
  metrics: otlp
  logs: otlp
  correlation-id-header: X-Correlation-Id
