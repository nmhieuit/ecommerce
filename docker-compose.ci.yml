# Local Jenkins + SonarQube, for exercising the CI pipeline in Jenkinsfile against a real
# SonarQube quality gate before either is provisioned for real (specs/012-sonarqube-quality-gate).
#
# Separate project name and compose file from docker-compose.yml (the application stack) — these
# are CI tooling, not part of the platform being built, and should be started/stopped independently.
#
#   docker compose -f docker-compose.ci.yml up -d
#   docker compose -f docker-compose.ci.yml down        # stop, keep data
#   docker compose -f docker-compose.ci.yml down -v     # stop and wipe Jenkins/SonarQube state
name: ecomerce-ci

networks:
  ci-backbone:
    driver: bridge

volumes:
  jenkins-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:

services:
  jenkins:
    # Built, not pulled: the stock image has no .NET SDK, no Node and no Docker CLI, so every
    # pipeline stage failed on its first command. See docker/ci/jenkins/Dockerfile.
    build:
      context: ./docker/ci/jenkins
    image: ecomerce-ci-jenkins:local
    # The stack is long-lived local infrastructure, and a stopped SonarQube does not fail loudly:
    # compose DNS simply stops resolving the name, so the next build dies with
    # "Name or service not known (sonarqube:9000)" that reads like a pipeline bug rather than a
    # container that was OOM-killed (exit 137) hours earlier. Restarting on its own removes that
    # whole class of confusing failure.
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      # Groovy init scripts run on every controller start, so the SonarQube server connection
      # survives `down -v` instead of having to be re-entered through the UI (T013).
      - ./docker/ci/jenkins-init:/var/jenkins_home/init.groovy.d:ro
      # Real tokens, gitignored. Mounted read-only so the init script can read them and nothing
      # in a build can write them.
      - ./.ci-secrets:/run/ci-secrets:ro
      # The host's Docker daemon, for the Testcontainers-based integration tier (spec 010).
      # Builds run on the controller in this local stack, so the controller is what needs it.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Testcontainers' Ryuk resource-reaper container failed to initialize under this Docker-
      # outside-of-Docker setup (Jenkins runs in a container sharing the *host's* Docker socket, so
      # sibling containers Ryuk itself spawns are not reachable back from inside the Jenkins
      # container the way they would be from the host) — observed as every Testcontainers-based
      # integration test failing with `ResourceReaperException: Initialization has been cancelled`.
      # Disabling Ryuk is the documented workaround for exactly this topology; it only means
      # containers a crashed run leaves behind aren't auto-cleaned, which is acceptable for a local,
      # disposable dev stack (not a choice to carry into a production Jenkins agent).
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Same Docker-outside-of-Docker cause, different symptom: once Ryuk stopped blocking startup,
      # SQL Server containers Testcontainers spins up still could not be *connected to* — the
      # client computed `localhost:<mapped-port>`, which is only correct when the process and the
      # Docker daemon share a network namespace (the normal same-host case). Here the daemon is the
      # Docker Desktop host's, one hop away from the Jenkins container, so the reachable address is
      # `host.docker.internal`, not `localhost`.
      TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
    networks: [ci-backbone]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  sonarqube:
    image: sonarqube:community
    # The stack is long-lived local infrastructure, and a stopped SonarQube does not fail loudly:
    # compose DNS simply stops resolving the name, so the next build dies with
    # "Name or service not known (sonarqube:9000)" that reads like a pipeline bug rather than a
    # container that was OOM-killed (exit 137) hours earlier. Restarting on its own removes that
    # whole class of confusing failure.
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks: [ci-backbone]
    environment:
      # Skips the Elasticsearch vm.max_map_count host-kernel check, which normally requires a host
      # sysctl change (262144) not worth making just to run a local/dev SonarQube in Docker Desktop.
      # Do not carry this into a real deployment.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # Community Edition has no official GitHub PR decoration (ADR-0012 amendment, T019) — the
      # community-maintained Branch Plugin adds it via a javaagent that patches the web/CE
      # processes at startup; it does nothing just sitting in extensions/plugins. The plugin jar
      # itself lives in the sonarqube-extensions volume (persists across recreation); these two
      # opts are what actually activate it, so they belong in compose, not typed into the UI.
      SONAR_WEB_JAVAADDITIONALOPTS: "-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-26.5.0.jar=web"
      SONAR_CE_JAVAADDITIONALOPTS: "-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-26.5.0.jar=ce"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
