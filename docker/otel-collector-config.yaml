# The endpoint ServiceDefaults already targets.
#
# Every service calls AddOtlpExporter() for traces, metrics, and logs with no endpoint configured,
# so the SDK defaults to http://localhost:4317 — which inside a container is the container itself.
# Without something listening, each service retries and logs export failures continuously, and that
# noise buries the real failures the stack's health gates are meant to surface
# (005-one-command-local-run research.md Decision 10).
#
# This is the collection point, not the only backend. Elastic (docker-compose.yml's
# `elasticsearch`/`kibana` services) is the durable backend a human queries in Kibana
# (017-otel-servicedefaults-elastic). The `debug` exporter stays alongside it, unchanged: it is
# what scripts/demo.ps1 parses to prove which services served a run, and that mechanism must not
# break just because a second, human-facing destination was added (research.md Decision 4 of that
# feature).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bounds memory so a burst of telemetry cannot starve the services being observed.
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Compact rather than verbose: one line per span keeps the log readable when six services are
  # emitting at once. Raise to `detailed` when chasing a specific trace.
  debug:
    verbosity: normal

  # Added alongside `debug`, not in place of it (research.md Decision 4 of
  # 017-otel-servicedefaults-elastic). `mode: otel` writes OTel-native, ECS-mapped data streams
  # (`traces-generic.otel-default`, `metrics-generic.otel-default`, `logs-generic.default`) that
  # Kibana's Observability apps read directly — no separate APM Server needed.
  elasticsearch:
    endpoints: [http://elasticsearch:9200]
    mapping:
      mode: otel

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, elasticsearch]

  telemetry:
    logs:
      level: warn
